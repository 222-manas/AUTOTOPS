name: AutoOps tests

on:
  push:
    branches: [main, integration/end-to-end]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Test observability watcher
        run: python -m pytest observability/watcher/tests -v

      - name: Test AI pipeline without requiring a live Ollama server
        run: >-
          python -m pytest ai_work/ai_pipeline -v
          --ignore=ai_work/ai_pipeline/diagnoser/test_ollama.py
          --ignore=ai_work/ai_pipeline/tests/test_ai_pipeline.py
          --ignore=ai_work/ai_pipeline/tests/test_all_incidents.py
